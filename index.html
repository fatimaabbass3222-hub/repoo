<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Landing Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e1b4b,
                #312e81
            );
            color: white;
        }

        /* Background circles */

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(5px);
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
        }

        .circle1 {
            width: 250px;
            height: 250px;
            background: #8b5cf6;
            top: -80px;
            left: -80px;
        }

        .circle2 {
            width: 300px;
            height: 300px;
            background: #06b6d4;
            bottom: -120px;
            right: -100px;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-30px);
            }
        }

        /* Main Card */

        .card {
            position: relative;
            width: 90%;
            max-width: 500px;
            padding: 50px 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);

            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;

            background: linear-gradient(
                90deg,
                #fff,
                #c4b5fd,
                #67e8f9
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #dbeafe;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        /* Button */

        .btn {
            display: inline-block;
            padding: 14px 30px;

            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;

            border-radius: 30px;

            background: linear-gradient(
                90deg,
                #6366f1,
                #8b5cf6
            );

            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);

            transition: 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 12px 35px rgba(139, 92, 246, 0.6);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Small text */

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #cbd5e1;
        }

        /* Mobile */

        @media (max-width: 500px) {

            .card {
                padding: 40px 25px;
            }

            h1 {
                font-size: 34px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>

    <div class="card">

        <div class="icon">🚀</div>

        <h1>Welcome!</h1>

        <p>
            Welcome to my modern website.
            This is a simple HTML page with
            beautiful animations and a glassmorphism design.
        </p>

        <a href="#" class="btn">
            Get Started →
        </a>

        <div class="footer">
            Made with ❤️ using HTML & CSS
        </div>

    </div>

</body>
</html>
